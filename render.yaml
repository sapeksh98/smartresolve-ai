services:
  - type: web
    name: smartresolve-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: smartresolve-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1